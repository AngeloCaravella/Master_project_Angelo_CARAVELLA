# Parameter specifications for sensitivity analysis
# Defines the path in the YAML config, type, baseline value, and exploration range.

number_of_charging_stations:
  path_yaml: ['number_of_charging_stations']
  type: int
  baseline: 25
  min: 5
  max: 100
  recommended_levels: 5

transformer.max_power:
  path_yaml: ['transformer', 'max_power']
  type: float # Can be int as well, but float is more general
  baseline: 100
  min: 25
  max: 400
  recommended_levels: 5

spawn_multiplier:
  path_yaml: ['spawn_multiplier']
  type: int
  baseline: 5
  min: 1
  max: 10
  recommended_levels: 5

ev.charge_efficiency:
  path_yaml: ['ev', 'charge_efficiency']
  type: float
  baseline: 0.95
  min: 0.80
  max: 0.99

ev.discharge_efficiency:
  path_yaml: ['ev', 'discharge_efficiency']
  type: float
  baseline: 0.90
  min: 0.70
  max: 0.98

ev.desired_capacity:
  path_yaml: ['ev', 'desired_capacity']
  type: float
  baseline: 1.0
  min: 0.6
  max: 1.0

discharge_price_factor:
  path_yaml: ['discharge_price_factor']
  type: float
  baseline: 1.0
  min: 0.5
  max: 2.0

inflexible_loads.forecast_mean:
  path_yaml: ['inflexible_loads', 'forecast_mean']
  type: float # Representing percentage as float from 0-100
  baseline: 30
  min: 0
  max: 60

solar_power.forecast_mean:
  path_yaml: ['solar_power', 'forecast_mean']
  type: float # Representing percentage as float from 0-100
  baseline: 20
  min: 0
  max: 80
